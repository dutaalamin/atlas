<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Collection | Atlas</title>
<meta name="description" content="Browse a collection of landing page templates." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/gallery.css">
</head>
<body>

<!-- NAV -->
<header class="nav">
  <div class="nav__inner">
    <div class="nav__left">
      <a href="/" class="brand"><span class="brand__mark"></span>Atlas</a>
      <nav class="nav__links">
        <a href="/">Collections</a>
        <a href="/all">All templates</a>
        <a href="#">SaaS</a>
      </nav>
    </div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="search" placeholder="Search in this collection" aria-label="Search templates">
    </label>
    <div class="nav__actions">
      <a href="#" class="muted">Log in</a>
      <a href="#" class="btn btn--primary">Get templates</a>
    </div>
  </div>
</header>

<main>
  <section class="tpl" style="padding-top:36px">
    <div class="tpl__head">
      <div>
        <a href="/" class="crumb">← All collections</a>
        <h1 class="tpl__title" id="title" style="margin-top:8px">Collection</h1>
        <p class="dim" id="subtitle" style="margin-top:6px;font-size:15px"></p>
      </div>
      <a href="/all" class="tpl__all">View all templates</a>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden><p>No templates in this collection yet.</p></div>
  </section>
</main>

<footer class="footer">
  <div class="container footer__inner">
    <span>© 2026 Atlas Templates. Hand-built, one at a time.</span>
    <span class="mono">atlas.templates</span>
  </div>
</footer>

<script>
(function () {
  'use strict';
  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var searchEl = document.getElementById('search');
  var all = [];
  var query = '';

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function initials(n) { return escapeHtml((n || '?').trim().charAt(0).toUpperCase()); }

  function tileHTML(t) {
    return '<a class="tile" href="template?id=' + encodeURIComponent(t.id) + '" aria-label="' + escapeHtml(t.name) + '">' +
      '<div class="tile__shot"><img loading="lazy" src="' + escapeHtml(t.preview) + '" alt="' + escapeHtml(t.name) + ' preview"></div>' +
      '<div class="tile__meta">' +
        '<span class="tile__mark" style="background:' + escapeHtml(t.accent || '#111') + '">' + initials(t.name) + '</span>' +
        '<div class="tile__text"><span class="tile__name">' + escapeHtml(t.name) + '</span>' +
        '<span class="tile__cat">' + escapeHtml(t.category || 'Landing page') + '</span></div>' +
      '</div></a>';
  }

  function render() {
    var list = all.filter(function (t) {
      if (!query) return true;
      return [t.name, t.category].join(' ').toLowerCase().indexOf(query) !== -1;
    });
    grid.innerHTML = list.map(tileHTML).join('');
    empty.hidden = list.length > 0;
  }

  if (searchEl) searchEl.addEventListener('input', function () {
    query = searchEl.value.trim().toLowerCase(); render();
  });

  var id = new URLSearchParams(location.search).get('id');
  fetch('assets/data/templates.json')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var cols = data.collections || [];
      var col = cols.filter(function (c) { return c.id === id; })[0];
      if (!col) {
        document.getElementById('title').textContent = 'Collection not found';
        grid.innerHTML = ''; empty.hidden = false;
        empty.querySelector('p').textContent = 'That collection doesn\u2019t exist.';
        return;
      }
      document.title = col.name + ' — Atlas';
      document.getElementById('title').textContent = col.name;
      all = (data.templates || []).filter(function (t) { return t.collection === id; });
      document.getElementById('subtitle').textContent = all.length + ' template' + (all.length === 1 ? '' : 's') + (col.desc ? ' · ' + col.desc : '');
      render();
    })
    .catch(function () {
      grid.innerHTML = ''; empty.hidden = false;
      empty.querySelector('p').textContent = 'Could not load templates.json — run this folder from a local server.';
    });
})();
</script>
</body>
</html>
