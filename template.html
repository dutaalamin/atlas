<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Template | Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/gallery.css">
<style>
  .detail { padding: 28px 0 0; }
  .detail__bar {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding-bottom: 22px; margin-bottom: 22px; border-bottom: 1px solid var(--line-soft);
  }
  .back {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 500; color: var(--fg-muted);
    padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line);
    transition: all var(--dur) var(--ease);
  }
  .back:hover { color: var(--fg); border-color: var(--fg); }
  .detail__title { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .detail__cat { font-size: 13px; color: var(--fg-dim); }
  .detail__actions { margin-left: auto; }

  /* the long, unbroken preview */
  .shot {
    width: 100%;
    display: block;
    border-radius: 14px;
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    background: var(--bg-soft);
  }

  .notfound { text-align: center; padding: 120px 20px; }
  .notfound h2 { font-size: 28px; margin-bottom: 12px; }
  .notfound p { color: var(--fg-muted); margin-bottom: 24px; }

  @media (max-width: 820px) {
    .detail__actions { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<header class="nav">
  <div class="container nav__inner">
    <a href="index.html" class="brand"><span class="brand__mark"></span>Atlas</a>
    <nav class="nav__links">
      <a href="index.html">Templates</a>
      <a href="#">Categories</a>
      <a href="#">About</a>
    </nav>
    <div class="nav__actions">
      <a href="#" class="muted">Log in</a>
      <a href="#" class="btn btn--primary">Get templates</a>
    </div>
  </div>
</header>

<main id="main"></main>

<footer class="footer">
  <div class="container footer__inner">
    <span>© 2026 Atlas Templates. Hand-built, one at a time.</span>
    <span class="mono">atlas.templates</span>
  </div>
</footer>

<script src="assets/js/detail.js"></script>
</body>
</html>
